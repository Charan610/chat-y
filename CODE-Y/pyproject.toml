[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codey-agent"
version = "0.1.0"
description = "CODE-Y: A terminal-native, provider-agnostic AI coding agent with automatic failover, MCP support, and Phosphor Amber TUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Charan" },
]
keywords = ["ai", "coding-agent", "terminal", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "typer[all]>=0.12.0",
    "textual>=0.79.0",
    "openai>=1.40.0",
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tiktoken>=0.7.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[project.scripts]
codey = "codey.cli:app"
forge = "codey.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["codey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
